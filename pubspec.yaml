name: axis
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

 
  #UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1


  #Logic
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1
