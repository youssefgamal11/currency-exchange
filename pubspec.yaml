  #Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0


  #local storage
  shared_preferences: ^2.5.5

  

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



